<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barrier Avoidance - ناصر الدين</title>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
            text-align: center;
        }
        h1 { color: #38bdf8; font-size: 22px; margin-bottom: 5px; }
        p { color: #94a3b8; font-size: 13px; margin-bottom: 15px; }
        canvas {
            background-color: #1e293b;
            border: 2px solid #334155;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            max-width: 100%;
            touch-action: manipulation;
        }
        .btn {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
            transition: background-color 0.3s;
        }
        .btn:hover { background-color: #1d4ed8; }
        .author { margin-top: 10px; color: #38bdf8; font-size: 14px; font-weight: bold; }
    </style>
</head>
<body>

    <h1>لعبة تفادي الحواجز</h1>
    <p>اضغط على الشاشة أو زر القفز لتفادي العقبات وجمع النقاط!</p>

    <canvas id="gameCanvas" width="320" height="400"></canvas>
    <button class="btn" id="jumpBtn">قفز / ابدأ</button>
    <div class="author">تصميم المطور: ناصر الدين</div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let player = {
            x: 50,
            y: 300,
            width: 25,
            height: 25,
            dy: 0,
            jumpPower: -10,
            gravity: 0.5,
            grounded: false
        };

        let obstacle = {
            x: 320,
            y: 305,
            width: 20,
            height: 20,
            speed: 4
        };

        let score = 0;
        let isGameOver = false;

        function jump() {
            if (player.grounded && !isGameOver) {
                player.dy = player.jumpPower;
                player.grounded = false;
            } else if (isGameOver) {
                resetGame();
            }
        }

        document.getElementById('jumpBtn').addEventListener('click', jump);
        canvas.addEventListener('click', jump);

        function resetGame() {
            player.y = 300;
            player.dy = 0;
            obstacle.x = 320;
            obstacle.speed = 4;
            score = 0;
            isGameOver = false;
            loop();
        }

        function update() {
            if (isGameOver) return;

            player.dy += player.gravity;
            player.y += player.dy;

            if (player.y > 300) {
                player.y = 300;
                player.dy = 0;
                player.grounded = true;
            }

            obstacle.x -= obstacle.speed;
            if (obstacle.x < -20) {
                obstacle.x = 320;
                score++;
                if (score % 5 === 0) obstacle.speed += 0.5;
            }

            if (
                player.x < obstacle.x + obstacle.width &&
                player.x + player.width > obstacle.x &&
                player.y < obstacle.y + obstacle.height &&
                player.y + player.height > obstacle.y
            ) {
                isGameOver = true;
            }
        }

        function draw() {
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#334155';
            ctx.fillRect(0, 325, canvas.width, 75);

            if (!isGameOver) {
                ctx.fillStyle = '#38bdf8';
                ctx.fillRect(player.x, player.y, player.width, player.height);

                ctx.fillStyle = '#f43f5e';
                ctx.fillRect(obstacle.x, obstacle.y, obstacle.width, obstacle.height);
            } else {
                ctx.fillStyle = '#f8fafc';
                ctx.font = '20px Arial';
                ctx.fillText('انتهت اللعبة!', 110, 180);
                ctx.font = '14px Arial';
                ctx.fillText('اضغط للبدء من جديد', 105, 215);
            }

            ctx.fillStyle = '#f8fafc';
            ctx.font = '16px Arial';
            ctx.fillText('النقاط: ' + score, 20, 30);
        }

        function loop() {
            update();
            draw();
            if (!isGameOver) {
                requestAnimationFrame(loop);
            }
        }

        loop();
    </script>

</body>
</html>
